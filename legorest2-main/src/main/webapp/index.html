<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="content-type" content="application/xhtml+xml; charset=UTF-8" />
  <title>Lego Robot Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background-color: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    .section {
      background-color: white;
      padding: 15px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
    }

    input[type="button"] {
      padding: 8px 14px;
      margin: 4px;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #e8e8e8;
    }
  </style>
</head>

<body>

<script>
  var lego = new Object();
  lego.id = 1;
  lego.run = 1;
  lego.speed = 0;
  lego.turn = 0;
  lego.aika = 0;

  function sendData(form){
    var json = JSON.stringify(lego);
    var xhttp = new XMLHttpRequest();

    document.getElementById("setvalues").innerHTML = json;

    xhttp.onreadystatechange = function() {
      if (this.readyState == 4 && this.status == 200) {
        var settings = JSON.parse(this.responseText);
        document.getElementById("settings").innerHTML =
          "ID=" + settings.id +
          " | Run=" + settings.run +
          " | Speed=" + settings.speed +
          " | Turn=" + settings.turn;

        loadStats();
      }
    };

    xhttp.open("POST","/rest/lego/setvalues",true);
    xhttp.setRequestHeader("Content-type","application/json");
    xhttp.send(json);
  }

  function turnLeft(form){
    lego.turn = lego.turn - 10;
    sendData(form);
  }

  function turnRight(form){
    lego.turn = lego.turn + 10;
    sendData(form);
  }

  function stoplego(form){
    lego.run = 0;
    sendData(form);
  }

  function startlego(form){
    lego.run = 1;
    sendData(form);
  }

  function goFaster(form){
    lego.speed = lego.speed + 10;
    sendData(form);
  }

  function goSlower(form){
    lego.speed = lego.speed - 10;
    sendData(form);
  }

  function loadStats(){
    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function(){
      if (this.readyState == 4 && this.status == 200){
        var stats = JSON.parse(this.responseText);

        document.getElementById("avgSpeed").innerHTML = stats.avgSpeed;
        document.getElementById("totalCommands").innerHTML = stats.totalCommands;
        document.getElementById("totalSensorEvents").innerHTML = stats.totalSensorEvents;
        document.getElementById("wallEvents").innerHTML = stats.wallEvents;
      }
    };

    xhttp.open("GET","/rest/lego/getstats",true);
    xhttp.send();
  }

  function loadSensorEvents(){
    var xhttp = new XMLHttpRequest();

    xhttp.onreadystatechange = function(){
      if (this.readyState == 4 && this.status == 200){
        var events = JSON.parse(this.responseText);

        var html = "";
        html += "<table>";
        html += "<tr>";
        html += "<th>ID</th>";
        html += "<th>Sensor Type</th>";
        html += "<th>Value</th>";
        html += "<th>Speed</th>";
        html += "<th>Turn</th>";
        html += "<th>Action</th>";
        html += "<th>Time</th>";
        html += "</tr>";

        for (var i = 0; i < events.length; i++) {
          html += "<tr>";
          html += "<td>" + events[i].id + "</td>";
          html += "<td>" + events[i].sensorType + "</td>";
          html += "<td>" + events[i].sensorValue + "</td>";
          html += "<td>" + events[i].speed + "</td>";
          html += "<td>" + events[i].turn + "</td>";
          html += "<td>" + events[i].action + "</td>";
          html += "<td>" + events[i].aika + "</td>";
          html += "</tr>";
        }

        html += "</table>";

        document.getElementById("sensorEvents").innerHTML = html;
      }
    };

    xhttp.open("GET","/rest/lego/getsensordata",true);
    xhttp.send();
  }

  function refreshDashboard(){
    loadStats();
    loadSensorEvents();
  }

  setInterval(refreshDashboard, 5000);
</script>

<h1>Lego Robot Dashboard</h1>

<div class="section">
  <h3>Controls</h3>
  <form id="legoform">
    <input type="button" value="Slower" onclick="goSlower(this.form);">
    <input type="button" value="Faster" onclick="goFaster(this.form);">
    <input type="button" value="Left" onclick="turnLeft(this.form);">
    <input type="button" value="Right" onclick="turnRight(this.form);">
    <input type="button" value="STOP" onclick="stoplego(this.form);">
    <input type="button" value="START" onclick="startlego(this.form);">
  </form>
</div>

<div class="section">
  <h3>Current Settings</h3>
  <p id="settings">No command sent yet.</p>
</div>

<div class="section">
  <h3>Statistics</h3>
  <table>
    <tr>
      <th>Average Speed</th>
      <th>Total Commands</th>
      <th>Total Sensor Events</th>
      <th>Wall Events</th>
    </tr>
    <tr>
      <td id="avgSpeed">-</td>
      <td id="totalCommands">-</td>
      <td id="totalSensorEvents">-</td>
      <td id="wallEvents">-</td>
    </tr>
  </table>
  <br>
  <input type="button" value="Refresh Statistics" onclick="loadStats();">
</div>

<div class="section">
  <h3>Recent Sensor Events</h3>
  <div id="sensorEvents">No sensor events loaded yet.</div>
  <br>
  <input type="button" value="Refresh Sensor Events" onclick="loadSensorEvents();">
</div>

<div class="section">
  <h3>Last JSON Sent</h3>
  <p id="setvalues">Nothing sent yet.</p>
</div>

<script>
  refreshDashboard();
</script>

</body>
</html>
